name: Construir y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://santiagocastellanos14.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/lolamorawine' }}

      - name: Validar (SEO, enlaces, imágenes, restos del sitio viejo)
        run: npm run validar
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/lolamorawine' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
